<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FactoryManager — Operator Kiosk</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <style>
    :root {
      --bg:       #f4f5f7;
      --surface:  #ffffff;
      --border:   #e2e5ea;
      --text:     #1a1d23;
      --muted:    #6b7280;
      --primary:  #2563eb;
      --success:  #16a34a;
      --warning:  #d97706;
      --danger:   #dc2626;
      --purple:   #7c3aed;
      --teal:     #0d9488;
      --radius:   12px;
      --shadow:   0 2px 12px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
    }

    /* ── Layout ── */
    .screen { display: none; flex-direction: column; gap: 14px; padding: 16px; min-height: 100vh; }
    .screen.active { display: flex; }

    /* ── Header ── */
    .hdr { display: flex; align-items: center; justify-content: space-between;
           padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .hdr-left { display: flex; flex-direction: column; gap: 2px; }
    .hdr-title { font-size: 15px; font-weight: 600; }
    .hdr-sub { font-size: 12px; color: var(--muted); }
    .hdr-right { display: flex; align-items: center; gap: 8px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%;
              background: #dbeafe; color: var(--primary);
              display: flex; align-items: center; justify-content: center;
              font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .icon-btn { background: none; border: none; font-size: 22px;
                color: var(--muted); cursor: pointer; padding: 4px;
                border-radius: 8px; line-height: 1; }
    .icon-btn:hover { background: var(--border); color: var(--text); }

    /* ── Timeout bar ── */
    .tbar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: -8px; }
    .tbar-fill { height: 100%; background: var(--muted); border-radius: 2px; transition: width 1s linear; }

    /* ── Cards ── */
    .card { background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }

    /* ── Buttons ── */
    .btn { border: none; border-radius: 10px; padding: 14px 20px;
           font-size: 15px; font-weight: 600; cursor: pointer;
           width: 100%; transition: opacity 0.15s, transform 0.1s; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .back-btn { background: none; border: none; font-size: 13px; color: var(--muted);
                cursor: pointer; display: flex; align-items: center; gap: 6px;
                padding: 2px 0; width: fit-content; }
    .back-btn:hover { color: var(--text); }
    .section-label { font-size: 11px; font-weight: 600; color: var(--muted);
                     text-transform: uppercase; letter-spacing: 0.6px; }

    /* ── Login ── */
    .brand { text-align: center; padding: 8px 0; }
    .brand i { font-size: 44px; color: var(--muted); }
    .brand-name { font-size: 22px; font-weight: 700; margin-top: 6px; }
    .brand-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .field-lbl { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    select.combo {
      width: 100%; padding: 11px 12px; font-size: 15px;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); color: var(--text); cursor: pointer;
    }
    select.combo:focus { outline: none; border-color: var(--primary); }
    .pin-dots { display: flex; gap: 14px; justify-content: center; margin: 4px 0; }
    .pin-dot { width: 16px; height: 16px; border-radius: 50%;
               border: 2px solid var(--border); background: transparent;
               transition: background 0.1s, border-color 0.1s; }
    .pin-dot.filled { background: var(--text); border-color: var(--text); }
    .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .pin-key { background: var(--surface); border: 1px solid var(--border);
               border-radius: 10px; padding: 16px 10px; font-size: 22px;
               font-weight: 600; cursor: pointer; text-align: center;
               color: var(--text); transition: background 0.1s;
               user-select: none; line-height: 1; box-shadow: var(--shadow); }
    .pin-key:active { background: var(--bg); }
    .pin-key.del { font-size: 18px; }
    .error-msg { font-size: 13px; color: var(--danger); text-align: center; min-height: 18px; }

    /* ── Machine grid ── */
    .machine-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .machine-card { background: var(--surface); border: 1px solid var(--border);
                    border-radius: var(--radius); padding: 16px 14px; cursor: pointer;
                    display: flex; flex-direction: column; gap: 8px;
                    box-shadow: var(--shadow); transition: border-color 0.15s, transform 0.1s; }
    .machine-card:active { transform: scale(0.97); }
    .machine-card:hover { border-color: var(--primary); }
    .machine-card i { font-size: 26px; color: var(--muted); }
    .machine-name { font-size: 14px; font-weight: 600; }
    .status-pill { font-size: 11px; padding: 3px 10px; border-radius: 99px;
                   display: inline-block; width: fit-content; font-weight: 500; }
    .s-available  { background: #dcfce7; color: #15803d; }
    .s-busy       { background: #fef3c7; color: #b45309; }
    .s-maintenance{ background: #fee2e2; color: #b91c1c; }

    /* ── Ops list ── */
    .ops-list { display: flex; flex-direction: column; gap: 10px; }
    .op-card { background: var(--surface); border: 1px solid var(--border);
               border-radius: var(--radius); padding: 14px; cursor: pointer;
               box-shadow: var(--shadow); transition: border-color 0.15s, transform 0.1s; }
    .op-card:active { transform: scale(0.98); }
    .op-card:hover { border-color: var(--primary); }
    .op-card.en_cours { border-left: 4px solid var(--purple); }
    .op-card.planifiee { border-left: 4px solid var(--primary); }
    .op-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .op-name { font-size: 14px; font-weight: 600; }
    .op-badge { font-size: 11px; padding: 3px 9px; border-radius: 99px;
                white-space: nowrap; flex-shrink: 0; font-weight: 500; }
    .b-planned    { background: #dbeafe; color: #1d4ed8; }
    .b-inprogress { background: #ede9fe; color: #6d28d9; }
    .op-detail { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .op-time-row { font-size: 11px; color: var(--muted); margin-top: 6px;
                   display: flex; align-items: center; gap: 4px; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 14px; }
    .empty-state i { font-size: 40px; display: block; margin-bottom: 12px; color: var(--border); }

    /* ── Pointage ── */
    .op-info-card { background: #f8faff; border: 1px solid #dbeafe;
                    border-radius: var(--radius); padding: 14px; }
    .op-info-name { font-size: 15px; font-weight: 600; }
    .op-info-sub  { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .chrono-wrap { text-align: center; padding: 12px 0; }
    .chrono-time { font-size: 56px; font-weight: 700; color: var(--text);
                   font-variant-numeric: tabular-nums; letter-spacing: -3px; line-height: 1; }
    .chrono-state { font-size: 13px; color: var(--muted); margin-top: 8px; font-weight: 500; }
    .chrono-state.running { color: var(--success); }
    .chrono-state.paused  { color: var(--warning); }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .action-btn { border: 1px solid var(--border); border-radius: var(--radius);
                  padding: 18px 10px; cursor: pointer; display: flex;
                  flex-direction: column; align-items: center; gap: 8px;
                  font-size: 14px; font-weight: 600; background: var(--surface);
                  color: var(--text); transition: background 0.15s, transform 0.1s;
                  box-shadow: var(--shadow); line-height: 1; }
    .action-btn:active:not(:disabled) { transform: scale(0.96); }
    .action-btn:hover:not(:disabled) { background: var(--bg); }
    .action-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    .action-btn i { font-size: 30px; }
    .action-btn.a-start  i { color: var(--success); }
    .action-btn.a-pause  i { color: var(--warning); }
    .action-btn.a-resume i { color: var(--primary); }
    .action-btn.a-finish i { color: var(--danger); }

    /* ── Break reasons ── */
    .motif-list { display: flex; flex-direction: column; gap: 10px; }
    .motif-btn { background: var(--surface); border: 1px solid var(--border);
                 border-radius: var(--radius); padding: 15px 16px; font-size: 15px;
                 cursor: pointer; color: var(--text); text-align: left;
                 display: flex; align-items: center; gap: 12px;
                 box-shadow: var(--shadow); transition: border-color 0.15s, transform 0.1s; }
    .motif-btn:active { transform: scale(0.98); }
    .motif-btn:hover { border-color: var(--primary); }
    .motif-btn i { font-size: 22px; color: var(--muted); }

    /* ── Recap ── */
    .recap-card { background: var(--surface); border: 1px solid var(--border);
                  border-radius: var(--radius); padding: 16px;
                  display: flex; flex-direction: column; gap: 10px; }
    .recap-row { display: flex; justify-content: space-between; font-size: 13px; }
    .recap-row span:first-child { color: var(--muted); }
    .recap-row span:last-child  { font-weight: 600; }
    .recap-row.positive span:last-child { color: var(--danger); }
    .recap-row.negative span:last-child { color: var(--success); }

    /* ── Loading overlay ── */
    .loading { display: none; position: fixed; inset: 0;
               background: rgba(255,255,255,0.85);
               align-items: center; justify-content: center;
               flex-direction: column; gap: 12px; z-index: 999; }
    .loading.active { display: flex; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border);
               border-top-color: var(--primary); border-radius: 50%;
               animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-msg { font-size: 14px; color: var(--muted); }

    /* ── Toast ── */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
             background: #1a1d23; color: #fff; padding: 12px 20px;
             border-radius: 10px; font-size: 13px; font-weight: 500;
             transition: transform 0.3s; z-index: 1000; white-space: nowrap; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: var(--danger); }
  </style>
</head>
<body>

<!-- Loading overlay -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="loading-msg" id="loading-msg">Loading...</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ═══════════════════════════════════════════════════════════
     SCREEN 1: LOGIN
════════════════════════════════════════════════════════════ -->

<!-- ═══════════════════════════════════════════════════════════

════════════════════════════════════════════════════════════ -->
<div id="s-machine" class="screen">

    <div class="hdr-right">

<!-- ═══════════════════════════════════════════════════════════

════════════════════════════════════════════════════════════ -->
<div id="s-ops" class="screen">
  <div class="hdr">

      <div class="avatar" id="av2">?</div>

<!-- ═══════════════════════════════════════════════════════════
     SCREEN 4: TIME TRACKING
════════════════════════════════════════════════════════════ -->
<div id="s-pointage" class="screen">
  <div class="hdr">
    <div class="hdr-left">
      <div class="hdr-title" id="ptr-machine-lbl">Machine</div>
      <div class="hdr-sub" id="ptr-user-lbl">Operator</div>
    </div>
    <div class="hdr-right">
      <div class="avatar" id="av3">?</div>
      <button class="icon-btn" onclick="goLogin()" title="Sign out"><i class="ti ti-logout"></i></button>
    </div>
  </div>
  <div class="tbar"><div class="tbar-fill" id="tf-ptr" style="width:100%"></div></div>
  <button class="back-btn" onclick="goOps()"><i class="ti ti-arrow-left"></i> Back to queue</button>
  <div class="op-info-card">
    <div class="op-info-name" id="ptr-op-name">Operation</div>
    <div class="op-info-sub"  id="ptr-op-detail">—</div>

  <div class="chrono-wrap">

      <i class="ti ti-player-play"></i>Start
    </button>
    <button class="action-btn a-pause"  id="btn-pause"  onclick="showScreen('s-motif')" disabled>
      <i class="ti ti-player-pause"></i>Break
    </button>
    <button class="action-btn a-resume" id="btn-resume" onclick="actionResume()" disabled>
      <i class="ti ti-player-play"></i>Resume
    </button>
    <button class="action-btn a-finish" id="btn-finish" onclick="actionFinish()" disabled>
      <i class="ti ti-check"></i>Complete
    </button>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     SCREEN 5: BREAK REASON
════════════════════════════════════════════════════════════ -->
<div id="s-motif" class="screen">
  <div class="hdr">
    <div class="hdr-title">Select break reason</div>
  </div>
  <div class="motif-list">
    <button class="motif-btn" onclick="actionPause('repas')">
      <i class="ti ti-soup"></i>Meal break
    </button>
    <button class="motif-btn" onclick="actionPause('panne')">
      <i class="ti ti-alert-triangle"></i>Machine breakdown
    </button>
    <button class="motif-btn" onclick="actionPause('attente_matiere')">
      <i class="ti ti-package"></i>Waiting for material
    </button>
    <button class="motif-btn" onclick="actionPause('formation')">
      <i class="ti ti-school"></i>Training / meeting
    </button>
    <button class="motif-btn" onclick="actionPause('autre')">
      <i class="ti ti-dots"></i>Other
    </button>
  </div>
  <button class="back-btn" onclick="showScreen('s-pointage')" style="margin-top:4px">
    <i class="ti ti-arrow-left"></i> Cancel

</div>

<!-- ═══════════════════════════════════════════════════════════
     SCREEN 6: COMPLETE
════════════════════════════════════════════════════════════ -->
<div id="s-fin" class="screen">
  <div style="text-align:center;padding:1.5rem 0 0.5rem">
    <i class="ti ti-circle-check" style="font-size:60px;color:var(--success)"></i>
    <div style="font-size:20px;font-weight:700;margin-top:12px">Operation completed</div>
  </div>
  <div class="recap-card" id="fin-recap"></div>
  <button class="btn btn-primary" onclick="goOps()">Next operation</button>
  <button class="back-btn" onclick="goLogin()" style="align-self:center;margin-top:4px">
    <i class="ti ti-logout"></i> Sign out
  </button>
</div>

<!-- ═══════════════════════════════════════════════════════════
     JAVASCRIPT
════════════════════════════════════════════════════════════ -->
<script>
// ── Configuration ────────────────────────────────────────────────────────────
const SUPABASE_URL  = "https://ujgpqzuuxigkketbmuyd.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVqZ3BxenV1eGlna2tldGJtdXlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MjI2MTcsImV4cCI6MjA5Mzk5ODYxN30.VKwxTwghbx31m6LB7ABckwlXyy2gBbyMlyQbw0chlCA";
const TIMEOUT_SEC   = 120;   // auto-logout after 2 minutes inactivity
const FN            = (name) => `${SUPABASE_URL}/functions/v1/${name}`;

// ── State ────────────────────────────────────────────────────────────────────
let session     = { id_user: null, display_name: null, niveau: null, initials: null };
let curMachine  = { id_machine: null, nom: null };
let curOp       = null;
let opStatus    = "planifiee";   // planifiee | en_cours | pause | terminee
let chronoIv    = null;
let t0          = null;          // Date of start
let pauseT      = null;          // Date of pause start
let pausedMs    = 0;
let toIv        = null;          // timeout interval

// ── API helper ───────────────────────────────────────────────────────────────
async function api(method, fn, body) {
  const opts = {
    method,
    headers: {
      "Authorization": `Bearer ${SUPABASE_ANON}`,
      "Content-Type":  "application/json",
    },
  };
  if (body) opts.body = JSON.stringify(body);
  const res  = await fetch(FN(fn), opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

// ── Loading helpers ──────────────────────────────────────────────────────────
function showLoading(msg = "Loading…") {
  document.getElementById("loading-msg").textContent = msg;
  document.getElementById("loading").classList.add("active");
}
function hideLoading() {
  document.getElementById("loading").classList.remove("active");
}

// ── Toast ────────────────────────────────────────────────────────────────────
let toastTm;
function showToast(msg, isError = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className   = "toast" + (isError ? " error" : "");
  t.classList.add("show");
  clearTimeout(toastTm);
  toastTm = setTimeout(() => t.classList.remove("show"), 3000);
}

// ── Screen management ────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  startTimeout(id);
  window.scrollTo(0, 0);
}

const TIMEOUT_BARS = { "s-machine": "tf-machine", "s-ops": "tf-ops", "s-pointage": "tf-ptr" };

function startTimeout(screenId) {
  clearInterval(toIv);
  const barId = TIMEOUT_BARS[screenId];
  if (!barId) return;
  let rem = TIMEOUT_SEC;
  const bar = document.getElementById(barId);
  if (bar) bar.style.width = "100%";
  toIv = setInterval(() => {
    rem--;
    if (bar) bar.style.width = Math.round(rem / TIMEOUT_SEC * 100) + "%";
    if (rem <= 0) { clearInterval(toIv); goLogin(); }
  }, 1000);
}

document.addEventListener("click",  () => { const a = document.querySelector(".screen.active"); if (a) startTimeout(a.id); });
document.addEventListener("touchstart", () => { const a = document.querySelector(".screen.active"); if (a) startTimeout(a.id); });

// ── Login ────────────────────────────────────────────────────────────────────
let pin = "";

async function loadUsers() {
  try {
    const users = await api("GET", "users");
    const sel   = document.getElementById("user-select");
    sel.innerHTML = '<option value="">— Choose operator —</option>';
    users.forEach(u => {
      const opt = document.createElement("option");
      opt.value       = u.id_user;
      opt.textContent = u.display_name;
      sel.appendChild(opt);
    });
  } catch (e) {
    document.getElementById("user-select").innerHTML =
      '<option value="">⚠ Cannot load operators</option>';
  }
}

function onUserChange() {
  pin = ""; updateDots();
  document.getElementById("login-error").textContent = "";
}

function pinKey(k) {
  const sel = document.getElementById("user-select").value;
  if (!sel) { document.getElementById("login-error").textContent = "Please select your name first."; return; }
  document.getElementById("login-error").textContent = "";
  if (k === "del")      { pin = pin.slice(0, -1); }
  else if (k === "ok")  { checkPin(); return; }
  else if (pin.length < 4) { pin += k; }
  updateDots();
  if (pin.length === 4) checkPin();
}

function updateDots() {
  for (let i = 0; i < 4; i++)
    document.getElementById("d" + i).classList.toggle("filled", i < pin.length);
}

async function checkPin() {
  const id_user = parseInt(document.getElementById("user-select").value);
  if (!id_user || pin.length !== 4) return;

  showLoading("Verifying PIN…");
  try {
    const res = await api("POST", "login", { id_user, pin });
    if (res.ok) {
      session.id_user       = res.id_user;
      session.display_name  = res.display_name;
      session.niveau        = res.niveau;
      session.initials      = res.display_name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();

      ["av1","av2","av3"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = session.initials;
      });
      document.getElementById("hdr-name").textContent = session.display_name;
      hideLoading();
      loadMachines();
      showScreen("s-machine");
    } else {
      hideLoading();
      document.getElementById("login-error").textContent = res.error || "Incorrect PIN.";
      pin = ""; updateDots();
    }
  } catch (e) {
    hideLoading();
    document.getElementById("login-error").textContent = "Connection error. Please try again.";
    pin = ""; updateDots();
  }
}

// ── Machines ─────────────────────────────────────────────────────────────────
async function loadMachines() {
  const grid = document.getElementById("machine-grid");
  grid.innerHTML = '<div class="empty-state" style="grid-column:span 2"><div class="spinner" style="margin:auto"></div></div>';
  try {
    const machines = await api("GET", "machines");
    if (!machines.length) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:span 2"><i class="ti ti-tool"></i>No machines available</div>';
      return;
    }

    const ICONS = { milling:"ti-tool", grinding:"ti-circle", welding:"ti-flame", lathe:"ti-settings", drilling:"ti-drill", default:"ti-settings-2" };

    grid.innerHTML = machines.map(m => {
      const icon   = ICONS[m.type] || ICONS.default;
      const status = m.statut === "available"    ? ["s-available",  "available"] :
                     m.statut === "maintenance"   ? ["s-maintenance","maintenance"] :
                                                    ["s-busy",       "in use"];
      const busy   = m.ops_en_cours > 0 ? ` · ${m.ops_en_cours} op${m.ops_en_cours > 1 ? "s" : ""} running` : "";
      return `
        <div class="machine-card" onclick="selectMachine(${m.id_machine}, '${m.nom.replace(/'/g,"\\'")}')">
          <i class="ti ${icon}"></i>
          <div class="machine-name">${m.nom}</div>
          <span class="status-pill ${status[0]}">${status[1]}${busy}</span>
        </div>`;
    }).join("");
  } catch (e) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:span 2"><i class="ti ti-alert-circle"></i>${e.message}</div>`;
  }
}

async function selectMachine(id, nom) {
  curMachine = { id_machine: id, nom };
  document.getElementById("ops-machine-lbl").textContent = nom;
  document.getElementById("ptr-machine-lbl").textContent = nom;
  document.getElementById("ptr-user-lbl").textContent    = session.display_name;
  document.getElementById("ops-date-lbl").textContent    =
    new Date().toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
  showScreen("s-ops");
  await loadOps();
}

// ── Operations ───────────────────────────────────────────────────────────────
async function loadOps() {
  const list = document.getElementById("ops-list");
  list.innerHTML = '<div class="empty-state"><div class="spinner" style="margin:auto"></div></div>';
  try {
    const ops = await api("GET", `operations?id_machine=${curMachine.id_machine}`);
    if (!ops.length) {
      list.innerHTML = '<div class="empty-state"><i class="ti ti-calendar-off"></i>No operations scheduled for today</div>';
      return;
    }
    list.innerHTML = ops.map(op => `
      <div class="op-card ${op.statut}" onclick='selectOp(${JSON.stringify(op)})'>
        <div class="op-row">
          <div class="op-name">${op.operation}</div>
          <span class="op-badge ${op.statut === "en_cours" ? "b-inprogress" : "b-planned"}">
            ${op.statut === "en_cours" ? "in progress" : "planned"}
          </span>
        </div>
        <div class="op-detail">${op.work_order} · ${op.component}</div>
        <div class="op-time-row"><i class="ti ti-clock" style="font-size:11px"></i>Planned: ${op.planned_min} min</div>
      </div>`).join("");
  } catch (e) {
    list.innerHTML = `<div class="empty-state"><i class="ti ti-alert-circle"></i>${e.message}</div>`;
  }
}

function selectOp(op) {
  curOp     = op;
  opStatus  = op.statut;

  document.getElementById("ptr-op-name").textContent   = op.operation;
  document.getElementById("ptr-op-detail").textContent =
    `${op.work_order} · ${op.component} · Planned: ${op.planned_min} min`;

  clearInterval(chronoIv);
  t0 = null; pauseT = null; pausedMs = 0;
  document.getElementById("chrono").textContent = "00:00:00";

  if (opStatus === "en_cours" && op.date_debut_reelle) {
    t0 = new Date(op.date_debut_reelle);
    chronoIv = setInterval(tickChrono, 1000);
    tickChrono();
  }
  updateBtns();
  showScreen("s-pointage");
}

// ── Chrono ───────────────────────────────────────────────────────────────────
function tickChrono() {
  if (!t0) return;
  const s = Math.floor((Date.now() - t0.getTime() - pausedMs) / 1000);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sc = s % 60;
  document.getElementById("chrono").textContent =
    String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0") + ":" + String(sc).padStart(2,"0");
}

// ── Buttons state ─────────────────────────────────────────────────────────────
function updateBtns() {
  document.getElementById("btn-start").disabled  = opStatus !== "planifiee";
  document.getElementById("btn-pause").disabled  = opStatus !== "en_cours";
  document.getElementById("btn-resume").disabled = opStatus !== "pause";
  document.getElementById("btn-finish").disabled = opStatus === "planifiee" || opStatus === "terminee";
  const lbl = document.getElementById("chrono-state");
  lbl.className = "chrono-state";
  if      (opStatus === "planifiee") { lbl.textContent = "Ready to start"; }
  else if (opStatus === "en_cours")  { lbl.textContent = "Running";  lbl.classList.add("running"); }
  else if (opStatus === "pause")     { lbl.textContent = "On break"; lbl.classList.add("paused"); }
}

// ── Actions ───────────────────────────────────────────────────────────────────
async function actionStart() {
  showLoading("Starting operation…");
  try {
    await api("POST", "pointage", { action:"start", id_op_plan: curOp.id_op_plan, id_user: session.id_user });
    t0 = new Date(); pausedMs = 0; opStatus = "en_cours";
    chronoIv = setInterval(tickChrono, 1000); tickChrono();
    updateBtns();
    showToast("Operation started");
  } catch (e) { showToast(e.message, true); }
  finally { hideLoading(); }
}

async function actionPause(motif) {
  showLoading("Recording break…");
  try {
    await api("POST", "pointage", { action:"pause", id_op_plan: curOp.id_op_plan, id_user: session.id_user, motif });
    pauseT = new Date(); opStatus = "pause";
    clearInterval(chronoIv);
    updateBtns();
    showScreen("s-pointage");
    showToast("Break recorded");
  } catch (e) { showToast(e.message, true); showScreen("s-pointage"); }
  finally { hideLoading(); }
}

async function actionResume() {
  showLoading("Resuming…");
  try {
    await api("POST", "pointage", { action:"resume", id_op_plan: curOp.id_op_plan, id_user: session.id_user });
    if (pauseT) pausedMs += Date.now() - pauseT.getTime();
    pauseT = null; opStatus = "en_cours";
    chronoIv = setInterval(tickChrono, 1000); tickChrono();
    updateBtns();
    showToast("Resumed");
  } catch (e) { showToast(e.message, true); }
  finally { hideLoading(); }
}

async function actionFinish() {
  showLoading("Saving…");
  try {
    const res = await api("POST", "pointage", { action:"finish", id_op_plan: curOp.id_op_plan, id_user: session.id_user });
    clearInterval(chronoIv);
    const ecart     = res.worked_min - curOp.planned_min;
    const sign      = ecart >= 0 ? "+" : "";
    const ecartCls  = ecart > 0 ? "positive" : ecart < 0 ? "negative" : "";
    document.getElementById("fin-recap").innerHTML = `
      <div class="recap-row"><span>Operation</span><span>${curOp.operation}</span></div>
      <div class="recap-row"><span>Work order</span><span>${curOp.work_order}</span></div>
      <div class="recap-row"><span>Operator</span><span>${session.display_name}</span></div>
      <div class="recap-row"><span>Working time</span><span>${res.worked_min} min</span></div>
      <div class="recap-row"><span>Break time</span><span>${res.pauses_min} min</span></div>
      <div class="recap-row"><span>Planned time</span><span>${curOp.planned_min} min</span></div>
      <div class="recap-row ${ecartCls}"><span>Variance</span><span>${sign}${ecart} min</span></div>`;
    opStatus = "terminee";
    showScreen("s-fin");
  } catch (e) { showToast(e.message, true); }
  finally { hideLoading(); }
}

// ── Navigation ────────────────────────────────────────────────────────────────
function goLogin() {
  clearInterval(toIv); clearInterval(chronoIv);
  session = { id_user:null, display_name:null, niveau:null, initials:null };
  pin = ""; updateDots();
  document.getElementById("login-error").textContent = "";
  document.getElementById("user-select").value = "";
  showScreen("s-login");
}
function goMachine() { showScreen("s-machine"); loadMachines(); }
async function goOps()  { showScreen("s-ops"); await loadOps(); }

// ── Init ──────────────────────────────────────────────────────────────────────
loadUsers();
</script>
